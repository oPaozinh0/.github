<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Davi de Oliveira Vieira — Senior Full Stack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0C1D"/>
      <stop offset="55%" stop-color="#141321"/>
      <stop offset="100%" stop-color="#241a3a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FE428E"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#A9FEF7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FE428E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FE428E"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#A9FEF7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .name  { font: 700 46px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: url(#ink); }
      .role  { font: 600 17px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #A9FEF7; letter-spacing: 2.6px; }
      .tag   { font: 500 13px 'Consolas','Fira Code',monospace; fill: #5F5A7A; letter-spacing: 1px; }
      .fade  { opacity: 0; animation: fade .9s ease forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      @keyframes fade { to { opacity: 1 } }
      @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
      .star { animation: twinkle 3.4s ease-in-out infinite; fill: #A9FEF7; }
    </style>
  </defs>

  <rect width="1000" height="220" fill="url(#sky)"/>
  <rect width="1000" height="220" fill="url(#grid)"/>

